name: Maven Publish on Release

on:
  release:
    types: [created]  # Trigger when a release is created

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write  # Needed to publish to GitHub Packages

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        server-id: github  # must match distributionManagement/repository/id in pom.xml
        settings-path: ${{ github.workspace }}  # saves settings.xml to root workspace

    - name: Build with Maven
      run: mvn -B package --file pom.xml

    - name: Publish to GitHub Packages
      run: mvn deploy -s ${{ github.workspace }}/settings.xml
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
